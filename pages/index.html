<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nate Wright (@natewright)</title>
</head>

<body>
    <!-- this creates the topbar of the screen which includes the portfolio logo and theme switch button -->
    <header class="topbar">
        <span class="portfolio-logo">portfolio</span>
        <button class="mode-switch" id="themeToggle" aria-label="Switch theme">
            <svg id="themeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round">
                <circle cx="12" cy="12" r="4.5" />
                <path
                    d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
            </svg>
        </button>
    </header>
    <!-- this creates the main content area of the page which includes the profile section and the main content section -->
    <main class="container">
        <aside class="side">
            <section class="profile">
                <!-- this is the top of the profile section that includes the name, profile photo and handle -->
                <div class="profile-top">
                    <div>
                        <!-- this is the display name -->
                        <h1 class="display-name">Nate Wright
                            <!-- this is the verified badge that appears next to the name -->
                            <svg class="verified verified-lg" viewBox="0 0 24 24" fill="currentColor" role="img"
                                aria-label="Verified">
                                <path
                                    d="M12 1.6l2.4 2.1 3.2-.3.9 3.1 2.9 1.4-1.2 3 1.2 3-2.9 1.4-.9 3.1-3.2-.3L12 22.4l-2.4-2.1-3.2.3-.9-3.1-2.9-1.4 1.2-3-1.2-3 2.9-1.4.9-3.1 3.2.3z" />
                                <path d="M10.6 15.6l-3-3 1.2-1.2 1.8 1.8 4.3-4.3 1.2 1.2z" fill="var(--check)" />
                            </svg>
                        </h1>
                        <!-- this is the handle and the pill that appears next to the handle -->
                        <div class="handle-row">
                            <span class="handle">@natewright</span>
                            <span class="pill">portfolio</span>
                        </div>
                    </div>
                    <!-- this is the profile photo that appears next to the name and handle -->
                    <div class="profile-photo" aria-hidden="true">NW</div>
                </div>
                <div class="profile-bio">
                    <p>Software engineer, web developer, and open source enthusiast. I love building things that make
                        people's lives better.</p>
                </div>
                <!-- this is the social links section that appears below the bio -->
                <nav class="socials">
                    <!-- this is the social link for Instagram that appears in the social links section -->
                    <a class="social-link" href="https://instagram.com/natewright" target="_blank"
                        rel="noopener noreferrer" aria-label="Instagram">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2.8" y="2.8" width="18.4" height="18.4" rx="5.2" />
                            <circle cx="12" cy="12" r="4.1" />
                            <circle cx="17.4" cy="6.6" r="1.15" fill="currentColor" stroke="none" />
                        </svg>
                    </a>
                    <!-- this is the social link for GitHub that appears in the social links section -->
                    <a class="social-link" href="https://github.com/natewright" target="_blank"
                        rel="noopener noreferrer" aria-label="GitHub">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M12 1.8a10.2 10.2 0 0 0-3.23 19.88c.51.09.7-.22.7-.5v-1.9c-2.84.62-3.44-1.2-3.44-1.2-.47-1.18-1.14-1.5-1.14-1.5-.93-.63.07-.62.07-.62 1.03.07 1.57 1.06 1.57 1.06.91 1.57 2.4 1.11 2.98.85.09-.66.36-1.11.65-1.37-2.27-.26-4.66-1.14-4.66-5.06 0-1.12.4-2.03 1.05-2.75-.1-.26-.46-1.3.1-2.71 0 0 .86-.28 2.81 1.05a9.7 9.7 0 0 1 5.12 0c1.95-1.33 2.8-1.05 2.8-1.05.57 1.41.21 2.45.11 2.71.66.72 1.05 1.63 1.05 2.75 0 3.93-2.39 4.8-4.67 5.05.37.32.69.94.69 1.9v2.82c0 .28.19.6.71.5A10.2 10.2 0 0 0 12 1.8z" />
                        </svg>
                    </a>
                    <!-- this is the social link for LinkedIn that appears in the social links section -->
                    <a class="social-link" href="https://www.linkedin.com/in/natewright" target="_blank"
                        rel="noopener noreferrer" aria-label="LinkedIn">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3.2 9.75h3.55V21H3.2V9.75zM9.4 9.75h3.4v1.54h.05c.47-.9 1.63-1.84 3.36-1.84 3.6 0 4.26 2.36 4.26 5.44V21h-3.55v-5.4c0-1.29-.02-2.95-1.8-2.95-1.8 0-2.08 1.4-2.08 2.86V21H9.4V9.75z" />
                        </svg>
                    </a>
                    <!-- this is the link for email that appears in the social links section -->
                    <a class="social-link" href="mailto:hello@natewright.com" target="_blank" rel="noopener noreferrer"
                        aria-label="Email">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2.6" y="4.6" width="18.8" height="14.8" rx="3" />
                            <path d="M3.4 7.6l7.5 5.2a2 2 0 0 0 2.2 0l7.5-5.2" />
                        </svg>
                    </a>
                </nav>
                <!-- this is the call to action buttons that appear below the social links section -->
                <div class="profile-ctas">
                    <a class="btn btn-primary" href="mailto:hello@natewright.com">Send an email</a>
                    <a class="btn btn-secondary" href="https://natewright.com/resume.pdf" target="_blank"
                        rel="noopener noreferrer">View resume</a>
                </div>
            </section>
            <!-- this is the tabs navigation section that appears below the profile -->
            <nav class="tabs" role="tablist" aria-label="Portfolio tabs">
            <button class="tab" role="tab" id="tab-home" aria-controls="panel-home" aria-selected="true">Home</button>
            <button class="tab" role="tab" id="tab-about" aria-controls="panel-about" aria-selected="false">About</button>
            <button class="tab" role="tab" id="tab-education" aria-controls="panel-education" aria-selected="false">Education</button>
            <button class="tab" role="tab" id="tab-projects" aria-controls="panel-projects" aria-selected="false">Projects</button>
            <button class="tab" role="tab" id="tab-contact" aria-controls="panel-contact" aria-selected="false">Contact</button>
            </nav>
        </aside>
        <!-- this is the home tab of the webpage
         this is where you will see: 
            a pinned post at the top
            other posts below it-->
        <div class="main-content" role="tabpanel" id="panel-home" aria-labelledby="tab-home">
            
        </div>
    </main>
</body>

</html>
